[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisplot"
version = "0.1.0"
description = "Retrieve and visualize tennis career match data from Tennis Abstract"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]